name: tests

on:
  push:
  pull_request:

jobs:
  golden-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Invitation repeat suppression
        run: python3 -m unittest discover -s tests -p 'test_star_invitation.py'
      - name: Run golden test suite
        run: python3 skills/itr-wala/scripts/test_tax_engine.py
      - name: Run validator test suite
        run: python3 skills/itr-wala/scripts/test_validate_income.py
      - name: Extraction tooling test suite
        run: python3 skills/itr-wala/scripts/test_extraction.py
      - name: Property fuzz (seeded, deterministic)
        run: |
          for fy in 2025-26 2026-27; do
            for purpose in return advance_tax; do
              python3 skills/itr-wala/scripts/fuzz_engine.py --cases 3000 --seed 42 --financial-year "$fy" --purpose "$purpose"
            done
          done
      - name: Validate example income.json
        run: |
          python3 skills/itr-wala/scripts/validate_income.py skills/itr-wala/assets/example-income.json
          python3 skills/itr-wala/scripts/tax_engine.py skills/itr-wala/assets/example-income.json > /dev/null
          python3 skills/itr-wala/scripts/validate_income.py skills/itr-wala/assets/example-advance-fy2026-27.json
          python3 skills/itr-wala/scripts/tax_engine.py skills/itr-wala/assets/example-advance-fy2026-27.json > /dev/null
